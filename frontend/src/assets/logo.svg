<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle background -->
  <circle cx="24" cy="24" r="22" fill="url(#gradient)" opacity="0.9"/>
  
  <!-- Chart bars -->
  <rect x="14" y="26" width="4" height="12" fill="#10b981" rx="1"/>
  <rect x="22" y="18" width="4" height="20" fill="#22d3ee" rx="1"/>
  <rect x="30" y="22" width="4" height="16" fill="#f97316" rx="1"/>
  
  <!-- Dollar sign -->
  <text x="24" y="10" font-size="16" font-weight="bold" fill="#e8fff6" text-anchor="middle" dominant-baseline="middle">$</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
